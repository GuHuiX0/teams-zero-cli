name: Tests and portable source
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -S -m unittest discover -v
      - run: python -S tools/release.py --verify
      - run: python -S tools/release.py --build dist/teams-zero-cli-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: teams-zero-cli-source-${{ matrix.os }}
          path: dist/*
